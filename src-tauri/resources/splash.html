<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夜记</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #121212;
        color: #e0e0e0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      .logo {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        color: #c4956a;
      }

      .logo svg {
        width: 48px;
        height: 48px;
      }

      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #e0e0e0;
      }

      .status-text {
        font-size: 0.95rem;
        color: #9e9e9e;
      }

      .privacy-tip {
        font-size: 0.75rem;
        color: #6e6e6e;
        margin-top: 0.25rem;
      }

      .progress-track {
        width: min(280px, 80vw);
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 35%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c4956a, #d4a574, #c4956a);
        background-size: 200% 100%;
        animation: slide 1.4s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-120%);
          background-position: 0% 50%;
        }
        100% {
          transform: translateX(320%);
          background-position: 100% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo" aria-hidden="true">
      <!-- N 新月 monogram -->
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 26V6h4.2l7.8 12.4V6H24v20h-4.3L12 13.8V26H8z" fill="currentColor"/>
        <path d="M20 4c3.5 0 6.5 2.2 7.6 5.3-2.8-.9-5.8-.4-8 1.5-2.2 1.9-3.2 4.8-2.7 7.7C15.1 15.2 13 13 11 13c-.8 0-1.5.2-2.1.6 1.6-3.5 5.1-5.6 9.1-5.6 1.3 0 2.5.2 3.6.7.3-1 .5-2 .5-3.1C22.5 5.6 21.5 4 20 4z" fill="currentColor" opacity="0.85"/>
      </svg>
    </div>
    <h1>夜记</h1>
    <p class="status-text">正在准备夜记…</p>
    <div class="progress-track" role="progressbar" aria-label="加载中">
      <div class="progress-bar"></div>
    </div>
    <p class="privacy-tip">所有数据仅保存在你的电脑上</p>
  </body>
</html>

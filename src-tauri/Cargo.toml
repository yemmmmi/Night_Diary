[package]
name = "night-diary"
version = "1.0.0"
description = "Night Diary — local AI diary desktop app"
authors = ["Night Diary"]
edition = "2021"

[lib]
name = "night_diary_lib"
crate-type = ["rlib"]

# NOTE: staticlib/cdylib were removed because they are only needed for mobile
# (Android/iOS) builds. On Windows desktop they generate 467MB+ lib artifacts
# that trigger E0786 corrupt metadata errors. Re-add them if mobile support is
# needed: crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2"

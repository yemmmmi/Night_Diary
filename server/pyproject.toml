[project]
name = "night-diary-server"
version = "0.0.1"
description = "Night Diary V2 — AI engine (FastAPI backend)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",

    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "chromadb>=0.5,<0.6",
    "jieba>=0.42",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2,<1.0",
    "openai>=1.40,<2.0",
    "cryptography>=43.0",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "huggingface_hub>=0.26",

    # Database (dual-engine: SQLite dev default + MySQL production)
    "pymysql>=1.1.0",
    "alembic>=1.13.0",

    # Background task queue (RQ workers; falls back to threading without Redis)
    "rq>=1.16.0",

    # Entity graph (Neo4j; optional, falls back to SQLite)
    "neo4j>=5.0.0",
    "mcp>=1.0",
    "langgraph>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # Pin ruff to the same version as .pre-commit-config.yaml so CI (pip
    # install -e ".[dev]") and local runs never drift on lint rules.
    "ruff==0.6.9",
    "mypy>=1.11",
    "pytest-asyncio>=0.24",
    "scipy>=1.11",
]
# Heavy ML deps needed ONLY to run the offline RAG eval (server/tests/eval/rag).
# Kept out of the core runtime so CI and unit-test dev stay lightweight (unit
# tests mock the models). The eval gracefully skips model-dependent branches
# when these are absent. They will graduate to runtime deps when the reranker /
# embedding are wired into production (Phase C-1 / E).
eval = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "S101"]
"app/domain/knowledge/extractor.py" = ["RUF001"]
"app/domain/rag/chunker.py" = ["RUF001"]
"app/domain/feedback/prompt_tuner.py" = ["RUF001"]
"app/domain/skills/crisis_detector.py" = ["RUF001"]
"app/domain/skills/sentiment_skill.py" = ["RUF001"]
"app/domain/agents/prompts.py" = ["RUF001"]
"app/domain/agents/intent_classifier.py" = ["RUF001"]
"app/domain/agents/empathy_agent.py" = ["RUF001"]
"app/domain/agents/insight_agent.py" = ["RUF001"]
"app/domain/agents/retrieval_agent.py" = ["RUF001"]
"app/domain/agents/supervisor.py" = ["RUF001"]
"app/domain/agents/context_compressor.py" = ["RUF001"]
"tests/unit/domain/agents/**" = ["RUF001"]
"tests/unit/domain/skills/**" = ["RUF001"]
"tests/unit/domain/memory/**" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/domain/rag/test_chunker.py" = ["RUF001"]
"tests/unit/shared/test_emotion_estimator.py" = ["RUF001"]
"tests/unit/shared/test_token_utils.py" = ["RUF001"]
"tests/unit/services/**" = ["RUF001"]
"tests/unit/api/**" = ["RUF001"]
"app/api/schemas.py" = ["RUF001"]
"app/services/**" = ["RUF001"]
"app/shared/errors.py" = ["RUF001"]
"app/shared/llm_factory.py" = ["RUF001", "RUF012"]
"app/infrastructure/security.py" = ["RUF001"]
"tests/unit/eval/test_judge.py" = ["RUF001"]
"tests/eval/judge.py" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/rubric.py" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/generation/**" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/_http_llm.py" = ["RUF001"]
"tests/eval/_stub_llm.py" = ["RUF001"]
"tests/eval/tool_call/**" = ["RUF001"]
"tests/eval/intent/**" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/skill_call/**" = ["RUF001", "RUF002", "RUF003"]
"training/finetune_intent/**" = ["RUF001", "RUF002", "RUF003"]
"app/shared/emotion_estimator.py" = ["RUF001"]
"app/shared/crisis_guard.py" = ["RUF001"]
"tests/unit/shared/test_crisis_guard.py" = ["RUF001"]
"app/domain/memory/episodic.py" = ["RUF001", "RUF002", "RUF003"]
"app/domain/agents/chat_intent_classifier.py" = ["RUF001", "RUF002"]
"app/domain/agents/entity_extractor.py" = ["RUF001"]
"app/domain/agents/query_understander.py" = ["RUF001"]
"app/domain/orchestrator.py" = ["RUF001"]
"app/domain/skills/entity_tracker_skill.py" = ["RUF001"]
"app/domain/skills/memory_recall_skill.py" = ["RUF001"]
"app/domain/skills/skill_loader.py" = ["RUF001"]
"app/domain/skills/injection.py" = ["RUF001"]
"app/shared/tool_protocol.py" = ["RUF001"]
"tests/unit/domain/test_orchestrator.py" = ["RUF001"]
"scripts/seed_dev_traces.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/finetune/export_reranker_pairs.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/finetune/train_reranker_lora.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/finetune/eval_reranker.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/finetune/verify_container.py" = ["RUF001", "RUF002", "RUF003"]
# Migration script imports every model module for its Base.metadata side
# effect; ruff's F401 autofix would strip those imports, so disable F401 here.
"scripts/migrate_sqlite_to_mysql.py" = ["F401"]

# ---- Mypy ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

# These modules depend on optional packages (chromadb, langgraph, mcp) whose
# type stubs availability varies between local and CI environments. Disable
# warn_unused_ignores to avoid breakage when stubs are present locally but
# absent in CI (or vice versa).
[[tool.mypy.overrides]]
module = [
    "app.shared.embeddings",
    "app.services.ai.conversation_graph",
    "app.infrastructure.mcp_server",
]
warn_unused_ignores = false

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Exclude the offline eval suite from the default run (it needs the [eval]
# extra + model downloads); `make eval-rag` overrides with `-m eval`.
addopts = "-ra -m 'not eval'"
asyncio_mode = "auto"
markers = [
    "eval: offline RAG/generation eval; excluded from the default test run",
]

[project]
name = "night-diary-server"
version = "0.0.1"
description = "Night Diary V2 — local AI engine (FastAPI sidecar)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",

    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "chromadb>=0.5,<0.6",
    "jieba>=0.42",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.0",
    "pytest-asyncio>=0.24",
    "scipy>=1.11",
]
# Heavy ML deps needed ONLY to run the offline RAG eval (server/tests/eval/rag).
# Kept out of the core runtime so CI and unit-test dev stay lightweight (unit
# tests mock the models). The eval gracefully skips model-dependent branches
# when these are absent. They will graduate to runtime deps when the reranker /
# embedding are wired into production (Phase C-1 / E).
eval = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[project.scripts]
nightdiary-backend = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "S101"]
"app/domain/knowledge/extractor.py" = ["RUF001"]
"app/domain/rag/chunker.py" = ["RUF001"]
"app/domain/feedback/prompt_tuner.py" = ["RUF001"]
"app/domain/skills/crisis_detector.py" = ["RUF001"]
"app/domain/skills/sentiment_skill.py" = ["RUF001"]
"app/domain/agents/prompts.py" = ["RUF001"]
"app/domain/agents/intent_classifier.py" = ["RUF001"]
"app/domain/agents/empathy_agent.py" = ["RUF001"]
"app/domain/agents/insight_agent.py" = ["RUF001"]
"app/domain/agents/retrieval_agent.py" = ["RUF001"]
"app/domain/agents/supervisor.py" = ["RUF001"]
"tests/unit/domain/agents/**" = ["RUF001"]
"tests/unit/domain/skills/**" = ["RUF001"]
"tests/unit/domain/rag/test_chunker.py" = ["RUF001"]
"tests/unit/shared/test_emotion_estimator.py" = ["RUF001"]
"tests/unit/shared/test_token_utils.py" = ["RUF001"]
"tests/unit/eval/test_judge.py" = ["RUF001"]
"tests/eval/judge.py" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/rubric.py" = ["RUF001", "RUF002", "RUF003"]
"tests/eval/generation/**" = ["RUF001", "RUF002", "RUF003"]
"app/shared/emotion_estimator.py" = ["RUF001"]

# ---- Mypy ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Exclude the offline eval suite from the default run (it needs the [eval]
# extra + model downloads); `make eval-rag` overrides with `-m eval`.
addopts = "-ra -m 'not eval'"
asyncio_mode = "auto"
markers = [
    "eval: offline RAG/generation eval; excluded from the default test run",
]

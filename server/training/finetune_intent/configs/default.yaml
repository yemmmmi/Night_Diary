# ── LoRA Fine-tuning Config for Chat Intent Classification ──────────
#
# Base model : Qwen/Qwen2.5-1.5B
# Method     : LoRA (Low-Rank Adaptation)
# Task       : 6-class chat intent classification → JSON output
# Dataset    : server/tests/eval/intent/dataset/ (train 600 / val 100 / test 200)

# ── Model ──────────────────────────────────────────────────────────
base_model: "Qwen/Qwen2.5-1.5B"
tokenizer_name: ""              # empty → use base_model's tokenizer
max_seq_length: 512

# ── LoRA ───────────────────────────────────────────────────────────
method: "lora"
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  task_type: "CAUSAL_LM"

# ── Training ───────────────────────────────────────────────────────
training:
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"

# ── Evaluation & Checkpointing ─────────────────────────────────────
eval:
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "macro_f1"
  greater_is_better: true
  predict_with_generate: true

# ── Data ───────────────────────────────────────────────────────────
data:
  train_file: "tests/eval/intent/dataset/train.jsonl"
  val_file: "tests/eval/intent/dataset/val.jsonl"
  test_file: "tests/eval/intent/dataset/test.jsonl"
  prepared_dir: "training/finetune_intent/data"

# ── Output ─────────────────────────────────────────────────────────
output_dir: "training/finetune_intent/outputs"
save_total_limit: 3
logging_steps: 10
seed: 42
fp16: true                        # set false for CPU-only training
bf16: false
